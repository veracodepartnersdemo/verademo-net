name: Veracode DAST Scan

on:
  workflow_dispatch:

jobs:
  veracode-dast-scan:
    runs-on: ubuntu-latest

    env:
      VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_KEY_ID }}
      VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY_SECRET }}
      VERACODE_TARGET_UUID: ${{ secrets.VERACODE_TARGET_UUID }}

    steps:
      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: Verify Veracode CLI
        run: |
          ./veracode version

      - name: Validate Veracode credentials
        run: |
          ./veracode configure

      - name: Start DAST Scan
        run: |
          ./veracode dynamic scan \
            --webhook "${VERACODE_TARGET_UUID}"
